<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Perfumaria Árabe</title>
    <style>
        :root {
            --primary: #d4af37;        /* Dourado Luxo */
            --primary-dark: #aa8c2c;   /* Dourado Escuro */
            --primary-light: rgba(212, 175, 55, 0.15);
            --whatsapp: #25d366;
            --whatsapp-dark: #128c7e;
            --dark-bg: #0d0d0d;        /* Fundo Ultra Escuro */
            --card-bg: #161616;        /* Fundo dos Cards */
            --card-border: #262626;    /* Borda sutil */
            --text-main: #f5f5f5;      /* Texto Principal Claro */
            --text-muted: #999999;     /* Texto Secundário */
            --danger: #e74c3c;         /* Vermelho Desconto */
            --warning: #f39c12;        /* Amarelo Edição */
            --radius-standard: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            padding: 30px 15px;
            line-height: 1.6;
            padding-bottom: 90px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: var(--primary);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 24px;
            font-weight: 700;
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
        }

        header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background-color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Perfil da Loja */
        .loja-header {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: var(--radius-standard);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.08);
            margin-bottom: 40px;
            text-align: center;
        }

        .loja-capa-box {
            width: 100%;
            height: 220px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--card-border);
        }

        .loja-capa {
            width: 100%;
            height: 100%;
        }

        .loja-info-box {
            padding: 30px 20px;
        }

        .loja-nome {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }

        .loja-desc {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 25px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .botoes-vendedores-topo {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-vendedor-topo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--whatsapp);
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;

            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
        }

        .btn-vendedor-topo:hover {

        }

        .btn-grupo-topo {

            align-items: center;
            gap: 8px;
            background: #25d366;
            color: #000;
            padding: 10px 20px;
            border-radius: 50px;

            font-weight: 700;
            font-size: 14px;

        .btn-grupo-topo:hover {

        /* Sistema de Abas */
        .tabs {

            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .tab-btn {
            padding: 11px 24px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;

        .section {

        }

            animation: fadeIn 0.4s ease forwards;

        @keyframes fadeIn {

            background: var(--dark-bg);

    <!-- Script do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDa9Z9iHfcwBBQqNPAn2KvBtafxnpmBtcU",
          authDomain: "catalogo-whatsapp-a6649.firebaseapp.com",
          projectId: "catalogo-whatsapp-a6649",
          storageBucket: "catalogo-whatsapp-a6649.firebasestorage.app",
          messagingSenderId: "640318923290",
          appId: "1:640318923290:web:3a82a279298e248efda7a3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const SENHA_MESTRE = "1234";
        let carrinho = [];
        let produtosGlobais = {}; 
        let quantidadesCards = {}; 
        let dadosLojaGlobal = null;
        let imagemCapaBase64 = "";
        let imagemProdutoBase64 = "";

        function converterParaBase64(fileInputId, callback) {
            const fileInput = document.getElementById(fileInputId);
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { callback(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                callback(null);
            }
        }

        window.mudarAba = function(aba) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (aba === 'catalogo') {
                document.getElementById('secao-catalogo').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                carregarCatalogo();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                verificarLogin();
            }
        }

        window.fazerLogin = function() {
            const senhaDigitada = document.getElementById('senha-input').value;
            if (senhaDigitada === SENHA_MESTRE) {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('conteudo-gestor').style.display = 'block';
                carregarGerenciador();
                carregarDadosLojaNoForm();
            } else {
                alert('Senha incorreta!');
            }
        }

        function verificarLogin() {
            const logado = document.getElementById('conteudo-gestor').style.display === 'block';
            if (!logado) {
                document.getElementById('secao-gestor').classList.add('active');
                document.getElementById('tela-login').style.display = 'block';
                document.getElementById('conteudo-gestor').style.display = 'none';
            } else {
                document.getElementById('secao-gestor').classList.add('active');
            }
        }

        function calcularPrecoFinal(precoStr, tipoDesconto, valorDescontadoStr) {
            let precoLimpo = parseFloat(String(precoStr || '0').replace(',', '.')) || 0;
            let valDesc = parseFloat(String(valorDescontadoStr || '0').replace(',', '.')) || 0;
            if (valDesc <= 0) return { precoFinal: precoStr, valorNumerico: precoLimpo, temDesconto: false, textoTag: '' };

            let final = precoLimpo;
            let tag = '';

            if (tipoDesconto === 'porcentagem') {
                final = precoLimpo - ((precoLimpo * valDesc) / 100);
                tag = `-${valDesc}% OFF`;
            } else if (tipoDesconto === 'dinheiro') {
                final = precoLimpo - valDesc;
                tag = `-R$ ${valDesc.toFixed(2).replace('.', ',')}`;
            }
            if (final < 0) final = 0;

            return {
                precoFinal: final.toFixed(2).replace('.', ','),
                valorNumerico: final,
                temDesconto: true,
                textoTag: tag
            };
        }

        async function carregarCatalogo() {
            const perfilBox = document.getElementById('perfil-loja-container');
            const container = document.getElementById('lista-catalogo');
            if (!container) return;

            try {
                const docSnap = await getDoc(doc(db, "config", "perfil_loja"));
                if (docSnap.exists()) {
                    dadosLojaGlobal = docSnap.data();
                    const loja = dadosLojaGlobal;

                    let vendedoresHtml = '';
                    if (loja.vendedores && Array.isArray(loja.vendedores)) {
                        loja.vendedores.forEach(v => {
                            if (v.nome && v.telefone) {
                                let wppNum = v.telefone.replace(/\D/g, '');
                                vendedoresHtml += `<a href="https://wa.me/55${wppNum}?text=${encodeURIComponent('Olá ' + v.nome + ', gostaria de tirar dúvidas sobre os produtos do catálogo.')}" target="_blank" class="btn-vendedor-topo">💬 Falar com ${v.nome}</a>`;
                            }
                        });
                    }

                    let grupoHtml = '';
                    if (loja.linkGrupo) {
                        grupoHtml = `<a href="${loja.linkGrupo}" target="_blank" class="btn-grupo-topo">📢 Entrar no Grupo do WhatsApp</a>`;
                    }

                    perfilBox.innerHTML = `
                        ${loja.capa ? `<div class="loja-capa-box"><img src="${loja.capa}" alt="Capa" class="loja-capa" style="object-fit: ${loja.ajusteCapa || 'contain'};"></div>` : ''}
                        <div class="loja-info-box">
                            <div class="loja-nome">${loja.nome || 'Perfumaria Árabe'}</div>
                            <div class="loja-desc">${loja.descricao || ''}</div>
                            <div class="botoes-vendedores-topo">
                                ${vendedoresHtml}
                                ${grupoHtml}
                            </div>
                        </div>
                    `;
                }
            } catch (e) { console.error(e); }

            container.innerHTML = '<div class="sem-produtos">Carregando catálogo...</div>';

            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                container.innerHTML = '';
                produtosGlobais = {};

                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="sem-produtos">Nenhum produto cadastrado no momento.</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    const id = docSnap.id;
                    produtosGlobais[id] = prod;

                    if (!quantidadesCards[id]) {
                        quantidadesCards[id] = 1;
                    }

                    const calc = calcularPrecoFinal(prod.preco, prod.tipoDesconto, prod.valorDesconto);
                    const precoUnitarioNum = calc.valorNumerico;
                    const qtdAtual = quantidadesCards[id];
                    const subtotalCard = (precoUnitarioNum * qtdAtual).toFixed(2).replace('.', ',');

                    const card = document.createElement('div');
                    card.className = 'produto-card';
                    card.setAttribute('data-id', id);
                    card.innerHTML = `
                        <div class="tag-encomenda">📦 Sob Encomenda</div>
                        ${calc.temDesconto ? `<div class="tag-desconto">${calc.textoTag}</div>` : ''}
                        <div class="produto-img-box">
                            <img src="${prod.imagem}" alt="${prod.nome}" class="produto-img" style="object-fit: ${prod.ajusteImagem || 'contain'};" onerror="this.src='https://via.placeholder.com/280x230?text=Sem+Foto'">
                        </div>
                        <div class="produto-info">
                            <div class="produto-nome">${prod.nome}</div>
                            <div class="produto-desc">${prod.descricao || ''}</div>
                            <div class="preco-box">
                                ${calc.temDesconto ? `<span class="preco-antigo">R$ ${prod.preco}</span>` : ''}
                                <span class="produto-preco" id="preco-total-card-${id}">R$ ${subtotalCard}</span>
                            </div>
                        </div>
                        <div class="produto-acoes-footer">
                            <div class="card-qtd-controle">
                                <button class="card-qtd-btn" onclick="alterarQtdCard('${id}', -1, ${precoUnitarioNum})">-</button>
                                <span class="card-qtd-numero" id="qtd-card-num-${id}">${qtdAtual}</span>
                                <button class="card-qtd-btn" onclick="alterarQtdCard('${id}', 1, ${precoUnitarioNum})">+</button>
                            </div>
                            <button class="btn-add-carrinho" onclick="adicionarComQtdCard('${id}')">🛒 Adicionar ao Carrinho</button>
                        </div>
                    `;
                    container.appendChild(card);
                });
                atualizarCarrinhoUI();
            } catch (error) {
                console.error(error);
                container.innerHTML = '<div class="sem-produtos">Erro ao carregar os produtos.</div>';
            }
        }

        window.alterarQtdCard = function(id, delta, precoUnitario) {
            if (!quantidadesCards[id]) quantidadesCards[id] = 1;
            quantidadesCards[id] += delta;
            if (quantidadesCards[id] < 1) quantidadesCards[id] = 1;

            document.getElementById(`qtd-card-num-${id}`).innerText = quantidadesCards[id];
            let novoSubtotal = (precoUnitario * quantidadesCards[id]).toFixed(2).replace('.', ',');
            document.getElementById(`preco-total-card-${id}`).innerText = `R$ ${novoSubtotal}`;
        }

        window.adicionarComQtdCard = function(id) {
            const produto = produtosGlobais[id];
            if (!produto) return;

            const qtdParaAdicionar = quantidadesCards[id] || 1;
            const calc = calcularPrecoFinal(produto.preco, produto.tipoDesconto, produto.valorDesconto);
            const itemExistente = carrinho.find(item => item.id === id);

            if (itemExistente) {
                itemExistente.quantidade += qtdParaAdicionar;
            } else {
                carrinho.push({
                    id: id,
                    nome: produto.nome,
                    precoNum: calc.valorNumerico,
                    precoStr: calc.precoFinal,
                    quantidade: qtdParaAdicionar
                });
            }

            atualizarCarrinhoUI();

            // Reseta o card para 1
            quantidadesCards[id] = 1;
            document.getElementById(`qtd-card-num-${id}`).innerText = 1;
            let subInicial = (calc.valorNumerico * 1).toFixed(2).replace('.', ',');
            document.getElementById(`preco-total-card-${id}`).innerText = `R$ ${subInicial}`;

            // Exibe o modal personalizado com os botões "Continuar" e "Agendar"
            document.getElementById('texto-aviso-sucesso').innerText = `✅ ${qtdParaAdicionar}x "${produto.nome}" adicionado com sucesso!`;
            document.getElementById('modal-aviso-sucesso').style.display = 'flex';
        }

        window.fecharAvisoContinuar = function() {
            document.getElementById('modal-aviso-sucesso').style.display = 'none';
        }

        window.acaoAgendarDoAviso = function() {
            document.getElementById('modal-aviso-sucesso').style.display = 'none';
            abrirCarrinhoModal();
        }

        window.mudarQuantidadeModal = function(id, delta) {
            const item = carrinho.find(i => i.id === id);
            if (item) {
                item.quantidade += delta;
                if (item.quantidade <= 0) {
                    carrinho = carrinho.filter(i => i.id !== id);
                }
            }
            atualizarCarrinhoUI();
            if(document.getElementById('modal-carrinho').style.display === 'flex') {
                abrirCarrinhoModal();
            }
        }

        window.removerDoCarrinho = function(id) {
            carrinho = carrinho.filter(item => item.id !== id);
            atualizarCarrinhoUI();
            if(document.getElementById('modal-carrinho').style.display === 'flex') {
                abrirCarrinhoModal();
            }
        }

        function atualizarCarrinhoUI() {
            const qtdTotal = carrinho.reduce((acc, item) => acc + item.quantidade, 0);
            const badge = document.getElementById('contador-carrinho');
            const flot = document.getElementById('carrinho-flutuante');
            
            if (qtdTotal > 0) {
                badge.innerText = qtdTotal;
                flot.style.display = 'flex';
            } else {
                flot.style.display = 'none';
            }
        }

        window.abrirCarrinhoModal = function() {
            const listaDiv = document.getElementById('itens-carrinho-modal');
            const totalDiv = document.getElementById('carrinho-total-modal');
            listaDiv.innerHTML = '';

            if (carrinho.length === 0) {
                listaDiv.innerHTML = '<p style="color:var(--text-muted); text-align:center; padding:15px;">Seu carrinho está vazio.</p>';
                totalDiv.innerText = 'Total: R$ 0,00';
            } else {
                let totalGeral = 0;
                carrinho.forEach(item => {
                    let subtotal = item.precoNum * item.quantidade;
                    totalGeral += subtotal;

                    const divItem = document.createElement('div');
                    divItem.className = 'item-carrinho-lista';
                    divItem.innerHTML = `
                        <div style="flex: 1;">
                            <strong>${item.nome}</strong><br>
                            <span style="color:var(--primary); font-weight:600;">R$ ${item.precoStr} un</span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div class="controle-qtd-box">
                                <button class="btn-qtd" onclick="mudarQuantidadeModal('${item.id}', -1)">-</button>
                                <span style="font-weight:700; min-width: 20px; text-align:center;">${item.quantidade}</span>
                                <button class="btn-qtd" onclick="mudarQuantidadeModal('${item.id}', 1)">+</button>
                            </div>
                            <button onclick="removerDoCarrinho('${item.id}')" style="background:var(--danger); color:#fff; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-size:11px;">🗑️</button>
                        </div>
                    `;
                    listaDiv.appendChild(divItem);
                });
                totalDiv.innerText = `Total: R$ ${totalGeral.toFixed(2).replace('.', ',')}`;
            }

            document.getElementById('modal-carrinho').style.display = 'flex';
        }

        window.fecharCarrinhoModal = function() {
            document.getElementById('modal-carrinho').style.display = 'none';
        }

        window.prosseguirCheckout = function() {
            if (carrinho.length === 0) {
                alert('Adicione produtos ao carrinho antes de continuar.');
                return;
            }
            document.getElementById('modal-carrinho').style.display = 'none';
            document.getElementById('modal-checkout').style.display = 'flex';
        }

        window.fecharCheckoutModal = function() {
            document.getElementById('modal-checkout').style.display = 'none';
        }

        window.finalizarPedidoWhatsApp = function(e) {
            e.preventDefault();

            const nome = document.getElementById('checkout-nome').value;
            const telefoneContato = document.getElementById('checkout-telefone').value;

            let itensTexto = "";
            let totalGeral = 0;

            carrinho.forEach(item => {
                let sub = item.precoNum * item.quantidade;
                totalGeral += sub;
                itensTexto += `• ${item.quantidade}x ${item.nome} (R$ ${item.precoStr} un)\n`;
            });

            let whatsappDestino = "5521999999999";
            if (dadosLojaGlobal && dadosLojaGlobal.vendedores && dadosLojaGlobal.vendedores.length > 0) {
                whatsappDestino = "55" + dadosLojaGlobal.vendedores[0].telefone.replace(/\D/g, '');
            }

            let mensagem = `*🛍️ PEDIDO / AGENDAMENTO (ENCOMENDA) - CATÁLOGO*\n\n` +
                           `*👤 Dados do Cliente:*\n` +
                           `• Nome: ${nome}\n` +
                           `• Contato: ${telefoneContato}\n\n` +
                           `*🛒 Itens Solicitados:*\n${itensTexto}\n` +
                           `*💰 Valor Total:* R$ ${totalGeral.toFixed(2).replace('.', ',')}`;

            const urlWpp = `https://wa.me/${whatsappDestino}?text=${encodeURIComponent(mensagem)}`;
            window.open(urlWpp, '_blank');
        }

        window.adicionarCampoVendedor = function(nome = '', telefone = '') {
            const container = document.getElementById('vendedores-container-inputs');
            const div = document.createElement('div');
            div.className = 'vendedor-item-box';
            div.innerHTML = `
                <input type="text" placeholder="Nome do Vendedor" class="vendedor-nome" value="${nome}" style="flex:1;" required>
                <input type="text" placeholder="WhatsApp (DDD+Número)" class="vendedor-tel" value="${telefone}" style="flex:1;" required>
                <button type="button" onclick="this.parentElement.remove()" style="background:var(--danger); color:#fff; border:none; padding:10px 12px; border-radius:6px; cursor:pointer;">X</button>
            `;
            container.appendChild(div);
        }

        async function carregarDadosLojaNoForm() {
            try {
                const docSnap = await getDoc(doc(db, "config", "perfil_loja"));
                if (docSnap.exists()) {
                    const loja = docSnap.data();
                    dadosLojaGlobal = loja;
                    document.getElementById('loja-nome-input').value = loja.nome || '';
                    document.getElementById('loja-desc-input').value = loja.descricao || '';
                    document.getElementById('loja-capa-fit').value = loja.ajusteCapa || 'contain';
                    document.getElementById('loja-grupo-input').value = loja.linkGrupo || '';
                    
                    if (loja.capa) {
                        imagemCapaBase64 = loja.capa;
                        const preview = document.getElementById('preview-capa-img');
                        preview.src = loja.capa;
                        document.getElementById('preview-capa-container').style.display = 'block';
                    }

                    const containerVendedores = document.getElementById('vendedores-container-inputs');
                    containerVendedores.innerHTML = '';
                    if (loja.vendedores && Array.isArray(loja.vendedores) && loja.vendedores.length > 0) {
                        loja.vendedores.forEach(v => adicionarCampoVendedor(v.nome, v.telefone));
                    } else {
                        adicionarCampoVendedor('Atendimento', '');
                    }
                }
            } catch (e) { console.error(e); }
        }

        async function carregarGerenciador() {
            const container = document.getElementById('lista-gerenciador');
            if (!container) return;
            container.innerHTML = '<p style="color:var(--text-muted)">Carregando...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                container.innerHTML = '';
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align:center;">Nenhum produto cadastrado.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    const id = docSnap.id;
                    const calc = calcularPrecoFinal(prod.preco, prod.tipoDesconto, prod.valorDesconto);
                    const precoMostra = calc.temDesconto ? `R$ ${calc.precoFinal} (Promo)` : `R$ ${prod.preco}`;

                    const item = document.createElement('div');
                    item.className = 'item-gerenciador';
                    item.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="${prod.imagem}" style="width: 45px; height: 45px; object-fit: ${prod.ajusteImagem || 'contain'}; border-radius: 6px; background: #000;" onerror="this.src='https://via.placeholder.com/45'">
                            <div>
                                <strong style="color: var(--text-main);">${prod.nome}</strong><br>
                                <span style="font-size: 13px; color: var(--primary);">${precoMostra} (Encomenda)</span>
                            </div>
                        </div>
                        <div class="acoes-gestor">
                            <button class="btn-editar" onclick="prepararEdicao('${id}', '${encodeURIComponent(prod.nome || '')}', '${encodeURIComponent(prod.preco || '')}', '${prod.tipoDesconto || 'porcentagem'}', '${prod.valorDesconto || ''}', '${encodeURIComponent(prod.descricao || '')}', '${prod.ajusteImagem || 'contain'}')">Editar</button>
                            <button class="btn-excluir" onclick="deletarProduto('${id}')">Excluir</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (error) { 
                console.error(error); 
                container.innerHTML = '<p style="color: var(--danger); text-align:center;">Erro ao carregar o gerenciador.</p>';
            }
        }

        window.prepararEdicao = function(id, nome, preco, tipoDesconto, valorDesconto, descricao, ajusteImagem) {
            document.getElementById('produto-id').value = id;
            document.getElementById('nome').value = decodeURIComponent(nome);
            document.getElementById('preco').value = decodeURIComponent(preco);
            document.getElementById('tipo-desconto').value = tipoDesconto || 'porcentagem';
            document.getElementById('valor-desconto').value = valorDesconto || '';
            document.getElementById('descricao').value = decodeURIComponent(descricao);
            document.getElementById('img-fit').value = ajusteImagem || 'contain';
            document.getElementById('btn-salvar-produto').innerText = 'Atualizar Produto';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.deletarProduto = async function(id) {
            if (confirm('Deseja excluir este produto?')) {
                try {
                    await deleteDoc(doc(db, "produtos", id));
                    carregarGerenciador();
                    carregarCatalogo();
                } catch (e) { alert('Erro ao excluir.'); }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const capaFile = document.getElementById('loja-capa-file');
            if (capaFile) {
                capaFile.addEventListener('change', () => {
                    converterParaBase64('loja-capa-file', (base64) => {
                        if (base64) {
                            imagemCapaBase64 = base64;
                            document.getElementById('preview-capa-img').src = base64;
                            document.getElementById('preview-capa-container').style.display = 'block';
                        }
                    });
                });
            }

            const prodFile = document.getElementById('produto-file');
            if (prodFile) {
                prodFile.addEventListener('change', () => {
                    converterParaBase64('produto-file', (base64) => {
                        if (base64) {
                            imagemProdutoBase64 = base64;
                            document.getElementById('preview-prod-img').src = base64;
                            document.getElementById('preview-prod-container').style.display = 'block';
                        }
                    });
                });
            }

            document.getElementById('form-loja').addEventListener('submit', async function(e) {
                e.preventDefault();

                const nomesVendedores = document.querySelectorAll('.vendedor-nome');
                const telsVendedores = document.querySelectorAll('.vendedor-tel');
                let listaVendedores = [];
                for (let i = 0; i < nomesVendedores.length; i++) {
                    listaVendedores.push({
                        nome: nomesVendedores[i].value,
                        telefone: telsVendedores[i].value
                    });
                }

                const dadosLoja = {
                    nome: document.getElementById('loja-nome-input').value,
                    capa: imagemCapaBase64,
                    ajusteCapa: document.getElementById('loja-capa-fit').value,
                    descricao: document.getElementById('loja-desc-input').value,
                    linkGrupo: document.getElementById('loja-grupo-input').value,
                    vendedores: listaVendedores
                };

                await setDoc(doc(db, "config", "perfil_loja"), dadosLoja);
                alert('Perfil e configurações atualizados com sucesso!');
                carregarCatalogo();
            });

            document.getElementById('form-produto').addEventListener('submit', async function(e) {
                e.preventDefault();
                const idEditando = document.getElementById('produto-id').value;
                const dadosProduto = {
                    nome: document.getElementById('nome').value,
                    preco: document.getElementById('preco').value,
                    tipoDesconto: document.getElementById('tipo-desconto').value,
                    valorDesconto: document.getElementById('valor-desconto').value,
                    imagem: imagemProdutoBase64,
                    ajusteImagem: document.getElementById('img-fit').value,
                    descricao: document.getElementById('descricao').value,
                    tipo: 'encomenda'
                };

                if (idEditando) {
                    await setDoc(doc(db, "produtos", idEditando), dadosProduto, { merge: true });
                    alert('Produto atualizado!');
                } else {
                    await addDoc(collection(db, "produtos"), dadosProduto);
                    alert('Produto cadastrado!');
                }

                this.reset();
                document.getElementById('produto-id').value = '';
                document.getElementById('btn-salvar-produto').innerText = 'Salvar Produto no Catálogo';
                document.getElementById('preview-prod-container').style.display = 'none';
                carregarGerenciador();
                carregarCatalogo();
            });

            carregarCatalogo();
        });
    </script>
</head>
<body>

    <header>
        <h1>Perfumaria Árabe</h1>
    </header>

    <div class="container">
        <!-- Abas -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('catalogo')">Ver Catálogo</button>
            <button class="tab-btn" onclick="mudarAba('gestor')">Painel Administrativo</button>
        </div>

        <!-- SEÇÃO: CATÁLOGO -->
        <div id="secao-catalogo" class="section active">
            <div id="perfil-loja-container" class="loja-header"></div>
            <div id="lista-catalogo" class="catalogo-grid"></div>
        </div>

        <!-- SEÇÃO: GESTOR -->
        <div id="secao-gestor" class="section">
            <div id="tela-login">
                <h3 style="margin-bottom: 15px; color: var(--primary);">Acesso Restrito</h3>
                <div class="form-group">
                    <input type="password" id="senha-input" placeholder="Senha (padrão: 1234)">
                </div>
                <button class="btn-login" onclick="fazerLogin()">Acessar Painel</button>
            </div>

            <div id="conteudo-gestor" style="display: none;">
                <div class="form-card">
                    <h2>⚙️ Personalização da Loja & Links</h2>
                    <form id="form-loja">
                        <div class="form-group">
                            <label>Nome da Loja:</label>
                            <input type="text" id="loja-nome-input" required>
                        </div>
                        <div class="form-group">
                            <label>Banner / Capa:</label>
                            <input type="file" id="loja-capa-file" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Ajuste da Capa:</label>
                            <select id="loja-capa-fit">
                                <option value="contain">Inteira (Sem cortes)</option>
                                <option value="cover">Preencher o espaço</option>
                            </select>
                            <div id="preview-capa-container" class="preview-container">
                                <div class="preview-box-capa"><img id="preview-capa-img" alt="Preview Capa"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Biografia / Descrição:</label>
                            <textarea id="loja-desc-input" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Link do Grupo do WhatsApp (Opcional):</label>
                            <input type="url" id="loja-grupo-input" placeholder="https://chat.whatsapp.com/...">
                        </div>

                        <div class="form-group">
                            <label>WhatsApp dos Vendedores (Para dúvidas no topo):</label>
                            <div id="vendedores-container-inputs" class="lista-vendedores-gerenciador"></div>
                            <button type="button" onclick="adicionarCampoVendedor()" style="background:var(--card-border); color:var(--primary); border:1px solid var(--primary); padding:8px; border-radius:6px; cursor:pointer; width:100%; margin-top:10px; font-weight:600;">+ Adicionar Outro Vendedor</button>
                        </div>

                        <button type="submit" class="btn-submit" style="margin-top: 20px;">Salvar Alterações da Loja</button>
                    </form>
                </div>

                <div class="form-card">
                    <h2>📦 Gerenciamento de Produtos (Por Encomenda)</h2>
                    <form id="form-produto">
                        <input type="hidden" id="produto-id">
                        <div class="form-group">
                            <label>Nome do Produto:</label>
                            <input type="text" id="nome" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Preço Normal (R$):</label>
                                <input type="text" id="preco" required placeholder="Ex: 160,00">
                            </div>
                            <div class="form-group">
                                <label>Tipo de Desconto:</label>
                                <select id="tipo-desconto">
                                    <option value="porcentagem">Porcentagem (%)</option>
                                    <option value="dinheiro">Valor Fixo (R$)</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Valor do Desconto (Opcional):</label>
                            <input type="text" id="valor-desconto" placeholder="Ex: 15">
                        </div>
                        <div class="form-group">
                            <label>Foto do Produto:</label>
                            <input type="file" id="produto-file" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Ajuste da Imagem:</label>
                            <select id="img-fit">
                                <option value="contain">Inteira (Sem cortes)</option>
                                <option value="cover">Preencher o espaço</option>
                            </select>
                            <div id="preview-prod-container" class="preview-container">
                                <div class="preview-box-img"><img id="preview-prod-img" alt="Preview Produto"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Descrição:</label>
                            <textarea id="descricao" rows="3" required placeholder="Ex: Perfume importado sob encomenda. Prazo de entrega de 15 dias..."></textarea>
                        </div>
                        <button type="submit" id="btn-salvar-produto" class="btn-submit">Salvar Produto no Catálogo</button>
                    </form>
                </div>
                
                <div style="margin-top: 40px; max-width: 650px; margin: 0 auto;">
                    <h3 style="color: var(--primary); margin-bottom: 15px;">Produtos Cadastrados</h3>
                    <div id="lista-gerenciador"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Botão Carrinho Flutuante -->
    <div id="carrinho-flutuante" class="carrinho-flutuante" style="display: none;" onclick="abrirCarrinhoModal()">
        🛒 Ver Carrinho <span id="contador-carrinho" class="badge-qtd">0</span>
    </div>

    <!-- Modal Personalizado de Aviso de Sucesso (Botões: Continuar / Agendar) -->
    <div id="modal-aviso-sucesso" class="modal-overlay">
        <div class="modal-content" style="text-align: center; max-width: 400px;">
            <h3 style="color: var(--primary); margin-bottom: 15px;">Produto Adicionado!</h3>
            <p id="texto-aviso-sucesso" style="font-size: 15px; margin-bottom: 25px; color: var(--text-main);"></p>
            <div style="display: flex; gap: 12px;">
                <button type="button" onclick="fecharAvisoContinuar()" style="flex: 1; background: var(--card-border); color: var(--text-main); border: 1px solid var(--primary); padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 13px;">Continuar</button>
                <button type="button" onclick="acaoAgendarDoAviso()" style="flex: 1; background: var(--primary); color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; font-size: 13px;">Agendar</button>
            </div>
        </div>
    </div>

    <!-- Modal do Carrinho -->
    <div id="modal-carrinho" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Seu Carrinho / Agendamento</h3>
                <button class="btn-fechar-modal" onclick="fecharCarrinhoModal()">&times;</button>
            </div>
            <div id="itens-carrinho-modal"></div>
            <div id="carrinho-total-modal" class="carrinho-total">Total: R$ 0,00</div>
            <button class="btn-submit" onclick="prosseguirCheckout()">Avançar para Envio ➔</button>
        </div>
    </div>

    <!-- Modal de Checkout Simplificado -->
    <div id="modal-checkout" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Finalizar Pedido de Encomenda</h3>
                <button class="btn-fechar-modal" onclick="fecharCheckoutModal()">&times;</button>
            </div>
            <form onsubmit="finalizarPedidoWhatsApp(event)">
                <div class="form-group">
                    <label>Seu Nome:</label>
                    <input type="text" id="checkout-nome" required placeholder="Ex: João da Silva">
                </div>
                <div class="form-group">
                    <label>Seu WhatsApp (Contato):</label>
                    <input type="text" id="checkout-telefone" required placeholder="Ex: (21) 99999-9999">
                </div>
                <button type="submit" class="btn-submit" style="background: var(--whatsapp); color:#fff; margin-top: 15px;">Enviar Pedido via WhatsApp 🚀</button>
            </form>
        </div>
    </div>

</body>
</html>
