<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | Perfumaria Árabe</title>
    <style>
        :root {
            --primary: #d4af37;        /* Dourado Luxo */
            --primary-dark: #aa8c2c;   /* Dourado Escuro */
            --primary-light: rgba(212, 175, 55, 0.15);
            --whatsapp: #25d366;
            --whatsapp-dark: #128c7e;
            --dark-bg: #0d0d0d;        /* Fundo Ultra Escuro */
            --card-bg: #161616;        /* Fundo dos Cards */
            --card-border: #262626;    /* Borda sutil */
            --text-main: #f5f5f5;      /* Texto Principal Claro */
            --text-muted: #999999;     /* Texto Secundário */
            --danger: #e74c3c;         /* Vermelho Desconto */
            --warning: #f39c12;        /* Amarelo Edição */
            --radius-standard: 14px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-main);
            padding: 30px 15px;
            line-height: 1.6;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: var(--primary);
            letter-spacing: 3px;
            text-transform: uppercase;
            font-size: 24px;
            font-weight: 700;
            display: inline-block;
            position: relative;
            padding-bottom: 8px;
        }

        header h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background-color: var(--primary);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Perfil da Loja no Topo (Estilo Banner Corporativo/Luxo) */
        .loja-header {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: var(--radius-standard);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 20px rgba(212, 175, 55, 0.08);
            margin-bottom: 40px;
            text-align: center;
        }

        .loja-capa-box {
            width: 100%;
            height: 220px;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--card-border);
        }

        .loja-capa {
            width: 100%;
            height: 100%;
        }

        .loja-info-box {
            padding: 30px 20px;
        }

        .loja-nome {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 10px;
            letter-spacing: 1.5px;
        }

        .loja-desc {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 25px;
            max-width: 650px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-grupo-topo {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--whatsapp);
            color: white;
            padding: 12px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.25);
        }

        .btn-grupo-topo:hover {
            background: var(--whatsapp-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.4);
        }

        /* Sistema de Abas */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .tab-btn {
            padding: 11px 24px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        .tab-btn.active {
            background: var(--primary);
            color: #000;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.25);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Tela de Login Administrativo */
        #tela-login {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 35px;
            border-radius: var(--radius-standard);
            max-width: 420px;
            margin: 50px auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Painel de Gestão */
        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 30px;
            border-radius: var(--radius-standard);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            max-width: 650px;
            margin: 0 auto 30px auto;
        }

        .form-card h2 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 13px;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--card-border);
            border-radius: 8px;
            font-size: 15px;
            background: var(--dark-bg);
            color: var(--text-main);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        input[type="file"] {
            padding: 8px;
            background: #111;
            cursor: pointer;
            font-size: 13px;
        }

        button.btn-submit, button.btn-login {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        button.btn-submit:hover, button.btn-login:hover {
            background: var(--primary-dark);
            color: #fff;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* Grid de Produtos refinada */
        .catalogo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 25px;
        }

        .produto-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-standard);
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
        }

        .produto-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.1);
        }

        .tag-desconto {
            position: absolute;
            top: 12px;
            right: 12px;
            background: var(--danger);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            z-index: 2;
            letter-spacing: 0.5px;
            box-shadow: 0 3px 10px rgba(231, 76, 60, 0.4);
            text-transform: uppercase;
        }

        .produto-img-box {
            width: 100%;
            height: 230px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--card-border);
        }

        .produto-img {
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease;
        }

        .produto-card:hover .produto-img {
            transform: scale(1.05);
        }

        .produto-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .produto-nome {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .produto-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .preco-box {
            margin-top: auto;
            padding-top: 5px;
        }

        .preco-antigo {
            font-size: 13px;
            color: #777;
            text-decoration: line-through;
            margin-right: 8px;
            display: inline-block;
        }

        .produto-preco {
            font-size: 20px;
            font-weight: 700;
            color: var(--primary);
            display: inline-block;
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--whatsapp);
            color: white;
            text-align: center;
            padding: 13px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border-radius: 0 0 var(--radius-standard) var(--radius-standard);
            transition: background 0.3s ease;
        }

        .btn-whatsapp:hover {
            background: var(--whatsapp-dark);
        }

        /* Gestor itens */
        .item-gerenciador {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 14px 18px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            color: #fff;
            transition: border-color 0.2s;
        }

        .item-gerenciador:hover {
            border-color: #444;
        }

        .acoes-gestor {
            display: flex;
            gap: 8px;
        }

        .btn-editar {
            background: var(--warning);
            color: #000;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: opacity 0.2s;
        }

        .btn-excluir {
            background: var(--danger);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: opacity 0.2s;
        }

        .btn-editar:hover, .btn-excluir:hover {
            opacity: 0.85;
        }

        .sem-produtos {
            text-align: center;
            grid-column: 1 / -1;
            padding: 60px 20px;
            color: var(--text-muted);
            font-size: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-standard);
        }

        .preview-container {
            margin-top: 12px;
            background: var(--dark-bg);
            border: 1px dashed var(--primary);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .preview-box-img, .preview-box-capa {
            background: #000;
            margin: 0 auto;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-radius: 6px;
        }

        .preview-box-img {
            width: 130px;
            height: 130px;
        }

        .preview-box-capa {
            width: 100%;
            height: 110px;
        }

        .preview-box-img img, .preview-box-capa img {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- Script do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDa9Z9iHfcwBBQqNPAn2KvBtafxnpmBtcU",
          authDomain: "catalogo-whatsapp-a6649.firebaseapp.com",
          projectId: "catalogo-whatsapp-a6649",
          storageBucket: "catalogo-whatsapp-a6649.firebasestorage.app",
          messagingSenderId: "640318923290",
          appId: "1:640318923290:web:3a82a279298e248efda7a3"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const SENHA_MESTRE = "1234";

        let imagemCapaBase64 = "";
        let imagemProdutoBase64 = "";

        function converterParaBase64(fileInputId, callback) {
            const fileInput = document.getElementById(fileInputId);
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    callback(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                callback(null);
            }
        }

        window.mudarAba = function(aba) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

            if (aba === 'catalogo') {
                document.getElementById('secao-catalogo').classList.add('active');
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                carregarCatalogo();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                verificarLogin();
            }
        }

        window.fazerLogin = function() {
            const senhaDigitada = document.getElementById('senha-input').value;
            if (senhaDigitada === SENHA_MESTRE) {
                document.getElementById('tela-login').style.display = 'none';
                document.getElementById('conteudo-gestor').style.display = 'block';
                carregarGerenciador();
                carregarDadosLojaNoForm();
            } else {
                alert('Senha incorreta!');
            }
        }

        function verificarLogin() {
            const logado = document.getElementById('conteudo-gestor').style.display === 'block';
            if (!logado) {
                document.getElementById('secao-gestor').classList.add('active');
                document.getElementById('tela-login').style.display = 'block';
                document.getElementById('conteudo-gestor').style.display = 'none';
            } else {
                document.getElementById('secao-gestor').classList.add('active');
            }
        }

        function calcularPrecoFinal(precoStr, tipoDesconto, valorDescontadoStr) {
            let precoLimpo = parseFloat(String(precoStr || '0').replace(',', '.')) || 0;
            let valDesc = parseFloat(String(valorDescontadoStr || '0').replace(',', '.')) || 0;

            if (valDesc <= 0) return { precoFinal: precoStr, temDesconto: false, textoTag: '' };

            let final = precoLimpo;
            let tag = '';

            if (tipoDesconto === 'porcentagem') {
                let descontoCalculado = (precoLimpo * valDesc) / 100;
                final = precoLimpo - descontoCalculado;
                tag = `-${valDesc}% OFF`;
            } else if (tipoDesconto === 'dinheiro') {
                final = precoLimpo - valDesc;
                tag = `-R$ ${valDesc.toFixed(2).replace('.', ',')}`;
            }

            if (final < 0) final = 0;

            return {
                precoFinal: final.toFixed(2).replace('.', ','),
                temDesconto: true,
                textoTag: tag
            };
        }

        async function carregarCatalogo() {
            const perfilBox = document.getElementById('perfil-loja-container');
            const container = document.getElementById('lista-catalogo');
            
            if (!container) return;

            try {
                const docSnap = await getDoc(doc(db, "config", "perfil_loja"));
                if (docSnap.exists()) {
                    const loja = docSnap.data();
                    const modoAjusteCapa = loja.ajusteCapa || 'contain';
                    perfilBox.innerHTML = `
                        ${loja.capa ? `
                            <div class="loja-capa-box">
                                <img src="${loja.capa}" alt="Capa da Loja" class="loja-capa" style="object-fit: ${modoAjusteCapa};">
                            </div>
                        ` : ''}
                        <div class="loja-info-box">
                            <div class="loja-nome">${loja.nome || 'Perfumaria Árabe'}</div>
                            <div class="loja-desc">${loja.descricao || ''}</div>
                            ${loja.linkGrupo ? `<a href="${loja.linkGrupo}" target="_blank" class="btn-grupo-topo">💬 Entrar no Grupo VIP do WhatsApp</a>` : ''}
                        </div>
                    `;
                } else {
                    perfilBox.innerHTML = '';
                }
            } catch (e) {
                console.error("Erro ao carregar perfil:", e);
            }

            container.innerHTML = '<div class="sem-produtos">Carregando catálogo com sofisticação...</div>';

            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                container.innerHTML = '';

                if (querySnapshot.empty) {
                    container.innerHTML = '<div class="sem-produtos">Nenhum produto cadastrado no momento.</div>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    const modoAjuste = prod.ajusteImagem || 'contain';

                    const calc = calcularPrecoFinal(prod.preco, prod.tipoDesconto, prod.valorDesconto);
                    const precoExibido = calc.temDesconto ? calc.precoFinal : prod.preco;

                    const msg = encodeURIComponent(`Olá, vi o catálogo e tenho interesse no produto: *${prod.nome}* (R$ ${precoExibido})`);
                    const linkWpp = `https://wa.me/${prod.whatsapp}?text=${msg}`;

                    const card = document.createElement('div');
                    card.className = 'produto-card';
                    card.innerHTML = `
                        ${calc.temDesconto ? `<div class="tag-desconto">${calc.textoTag}</div>` : ''}
                        <div class="produto-img-box">
                            <img src="${prod.imagem}" alt="${prod.nome}" class="produto-img" style="object-fit: ${modoAjuste};" onerror="this.src='https://via.placeholder.com/280x230?text=Sem+Foto'">
                        </div>
                        <div class="produto-info">
                            <div class="produto-nome">${prod.nome}</div>
                            <div class="produto-desc">${prod.descricao || ''}</div>
                            <div class="preco-box">
                                ${calc.temDesconto ? `<span class="preco-antigo">R$ ${prod.preco}</span>` : ''}
                                <span class="produto-preco">R$ ${precoExibido}</span>
                            </div>
                        </div>
                        <a href="${linkWpp}" target="_blank" class="btn-whatsapp">
                            <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                            Comprar pelo WhatsApp
                        </a>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                console.error("Erro ao carregar catálogo: ", error);
                container.innerHTML = '<div class="sem-produtos">Erro ao carregar os produtos. Verifique sua conexão.</div>';
            }
        }

        async function carregarDadosLojaNoForm() {
            try {
                const docSnap = await getDoc(doc(db, "config", "perfil_loja"));
                if (docSnap.exists()) {
                    const loja = docSnap.data();
                    document.getElementById('loja-nome-input').value = loja.nome || '';
                    document.getElementById('loja-desc-input').value = loja.descricao || '';
                    document.getElementById('loja-grupo-input').value = loja.linkGrupo || '';
                    document.getElementById('loja-capa-fit').value = loja.ajusteCapa || 'contain';
                    if (loja.capa) {
                        imagemCapaBase64 = loja.capa;
                        const preview = document.getElementById('preview-capa-img');
                        preview.src = loja.capa;
                        preview.style.objectFit = loja.ajusteCapa || 'contain';
                        document.getElementById('preview-capa-container').style.display = 'block';
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function carregarGerenciador() {
            const container = document.getElementById('lista-gerenciador');
            if (!container) return;
            container.innerHTML = '<p style="color:var(--text-muted)">Carregando painel...</p>';

            try {
                const querySnapshot = await getDocs(collection(db, "produtos"));
                container.innerHTML = '';

                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="color: var(--text-muted); text-align:center; padding: 20px;">Nenhum produto cadastrado ainda.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const prod = docSnap.data();
                    const id = docSnap.id;
                    const calc = calcularPrecoFinal(prod.preco, prod.tipoDesconto, prod.valorDesconto);
                    const precoMostra = calc.temDesconto ? `R$ ${calc.precoFinal} <span style="color:var(--danger); font-size:11px; font-weight:600;">(Promoção)</span>` : `R$ ${prod.preco}`;

                    const item = document.createElement('div');
                    item.className = 'item-gerenciador';
                    item.innerHTML = `
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <img src="${prod.imagem}" style="width: 45px; height: 45px; object-fit: ${prod.ajusteImagem || 'contain'}; border-radius: 6px; background: #000; border: 1px solid var(--card-border);" onerror="this.src='https://via.placeholder.com/45'">
                            <div>
                                <strong style="display: block; font-size: 15px; color: var(--text-main);">${prod.nome}</strong>
                                <span style="font-size: 13px; color: var(--primary);">${precoMostra}</span>
                            </div>
                        </div>
                        <div class="acoes-gestor">
                            <button class="btn-editar" onclick="prepararEdicao('${id}', '${encodeURIComponent(prod.nome || '')}', '${encodeURIComponent(prod.preco || '')}', '${prod.tipoDesconto || 'porcentagem'}', '${prod.valorDesconto || ''}', '${encodeURIComponent(prod.descricao || '')}', '${encodeURIComponent(prod.whatsapp || '')}', '${prod.ajusteImagem || 'contain'}')">Editar</button>
                            <button class="btn-excluir" onclick="deletarProduto('${id}')">Excluir</button>
                        </div>
                    `;
                    container.appendChild(item);
                });
            } catch (error) {
                console.error("Erro ao carregar gestor:", error);
                container.innerHTML = '<p style="color: var(--danger);">Erro ao carregar produtos.</p>';
            }
        }

        window.prepararEdicao = function(id, nome, preco, tipoDesconto, valorDesconto, descricao, whatsapp, ajusteImagem) {
            document.getElementById('produto-id').value = id;
            document.getElementById('nome').value = decodeURIComponent(nome);
            document.getElementById('preco').value = decodeURIComponent(preco);
            document.getElementById('tipo-desconto').value = tipoDesconto || 'porcentagem';
            document.getElementById('valor-desconto').value = valorDesconto || '';
            document.getElementById('descricao').value = decodeURIComponent(descricao);
            document.getElementById('whatsapp').value = decodeURIComponent(whatsapp);
            document.getElementById('img-fit').value = ajusteImagem || 'contain';
            document.getElementById('btn-salvar-produto').innerText = 'Atualizar Informações do Produto';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        window.deletarProduto = async function(id) {
            if (confirm('Deseja realmente excluir este produto permanentemente?')) {
                try {
                    await deleteDoc(doc(db, "produtos", id));
                    alert('Produto excluído com sucesso!');
                    carregarGerenciador();
                } catch (error) {
                    console.error("Erro ao excluir:", error);
                    alert('Erro ao excluir.');
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const capaFile = document.getElementById('loja-capa-file');
            if (capaFile) {
                capaFile.addEventListener('change', () => {
                    converterParaBase64('loja-capa-file', (base64) => {
                        if (base64) {
                            imagemCapaBase64 = base64;
                            const prevCapa = document.getElementById('preview-capa-img');
                            prevCapa.src = base64;
                            document.getElementById('preview-capa-container').style.display = 'block';
                            document.getElementById('loja-capa-fit').addEventListener('change', () => {
                                prevCapa.style.objectFit = document.getElementById('loja-capa-fit').value;
                            });
                        }
                    });
                });
            }

            const prodFile = document.getElementById('produto-file');
            if (prodFile) {
                prodFile.addEventListener('change', () => {
                    converterParaBase64('produto-file', (base64) => {
                        if (base64) {
                            imagemProdutoBase64 = base64;
                            const prevImg = document.getElementById('preview-prod-img');
                            prevImg.src = base64;
                            document.getElementById('preview-prod-container').style.display = 'block';
                            document.getElementById('img-fit').addEventListener('change', () => {
                                prevImg.style.objectFit = document.getElementById('img-fit').value;
                            });
                        }
                    });
                });
            }

            const formLoja = document.getElementById('form-loja');
            if (formLoja) {
                formLoja.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const ajusteCapaModo = document.getElementById('loja-capa-fit').value;
                    
                    const salvarDadosLoja = async (capaUrl) => {
                        const dadosLoja = {
                            nome: document.getElementById('loja-nome-input').value,
                            capa: capaUrl || imagemCapaBase64,
                            ajusteCapa: ajusteCapaModo,
                            descricao: document.getElementById('loja-desc-input').value,
                            linkGrupo: document.getElementById('loja-grupo-input').value
                        };

                        try {
                            await setDoc(doc(db, "config", "perfil_loja"), dadosLoja);
                            alert('Perfil da loja atualizado com sucesso!');
                            carregarCatalogo();
                        } catch (error) {
                            console.error("Erro ao salvar perfil:", error);
                            alert('Erro ao salvar perfil.');
                        }
                    };

                    if (document.getElementById('loja-capa-file').files.length > 0) {
                        converterParaBase64('loja-capa-file', (base64) => {
                            imagemCapaBase64 = base64;
                            salvarDadosLoja(base64);
                        });
                    } else {
                        const docSnap = await getDoc(doc(db, "config", "perfil_loja"));
                        const capaAntiga = docSnap.exists() ? docSnap.data().capa : "";
                        salvarDadosLoja(capaAntiga);
                    }
                });
            }

            const formProduto = document.getElementById('form-produto');
            if (formProduto) {
                formProduto.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const idEditando = document.getElementById('produto-id').value;
                    const ajusteModo = document.getElementById('img-fit').value;

                    const processarProduto = async (imgUrl) => {
                        const dadosProduto = {
                            nome: document.getElementById('nome').value,
                            preco: document.getElementById('preco').value,
                            tipoDesconto: document.getElementById('tipo-desconto').value,
                            valorDesconto: document.getElementById('valor-desconto').value,
                            imagem: imgUrl || imagemProdutoBase64,
                            ajusteImagem: ajusteModo,
                            descricao: document.getElementById('descricao').value,
                            whatsapp: document.getElementById('whatsapp').value
                        };

                        try {
                            if (idEditando) {
                                await setDoc(doc(db, "produtos", idEditando), dadosProduto, { merge: true });
                                alert('Produto atualizado com sucesso!');
                            } else {
                                dadosProduto.criadoEm = Date.now();
                                await addDoc(collection(db, "produtos"), dadosProduto);
                                alert('Produto cadastrado com sucesso!');
                            }

                            this.reset();
                            document.getElementById('produto-id').value = '';
                            document.getElementById('btn-salvar-produto').innerText = 'Salvar Produto no Catálogo';
                            document.getElementById('preview-prod-container').style.display = 'none';
                            carregarGerenciador();
                            carregarCatalogo();
                        } catch (error) {
                            console.error("Erro ao salvar produto: ", error);
                            alert('Erro ao salvar produto.');
                        }
                    };

                    if (document.getElementById('produto-file').files.length > 0) {
                        converterParaBase64('produto-file', (base64) => {
                            imagemProdutoBase64 = base64;
                            processarProduto(base64);
                        });
                    } else if (idEditando) {
                        const docSnap = await getDoc(doc(db, "produtos", idEditando));
                        const imgAntiga = docSnap.exists() ? docSnap.data().imagem : "";
                        processarProduto(imgAntiga);
                    } else {
                        alert('Por favor, selecione uma foto da galeria para o produto.');
                    }
                });
            }

            carregarCatalogo();
        });
    </script>
</head>
<body>

    <header>
        <h1>Perfumaria Árabe</h1>
    </header>

    <div class="container">
        <!-- Abas de Navegação -->
        <div class="tabs">
            <button class="tab-btn active" onclick="mudarAba('catalogo')">Ver Catálogo</button>
            <button class="tab-btn" onclick="mudarAba('gestor')">Painel Administrativo</button>
        </div>

        <!-- SEÇÃO: CATÁLOGO -->
        <div id="secao-catalogo" class="section active">
            <div id="perfil-loja-container" class="loja-header"></div>
            <div id="lista-catalogo" class="catalogo-grid"></div>
        </div>

        <!-- SEÇÃO: GESTOR -->
        <div id="secao-gestor" class="section">
            <!-- Tela de Login -->
            <div id="tela-login">
                <h3 style="margin-bottom: 15px; color: var(--primary); font-size: 18px;">Acesso Restrito</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Insira a senha de gestor para gerenciar sua loja.</p>
                <div class="form-group">
                    <input type="password" id="senha-input" placeholder="Senha (padrão: 1234)">
                </div>
                <button class="btn-login" onclick="fazerLogin()">Acessar Painel</button>
            </div>

            <!-- Conteúdo protegido -->
            <div id="conteudo-gestor" style="display: none;">
                
                <!-- 1. Configurar Perfil da Loja -->
                <div class="form-card">
                    <h2>⚙️ Personalização da Loja</h2>
                    <form id="form-loja">
                        <div class="form-group">
                            <label for="loja-nome-input">Nome da Loja:</label>
                            <input type="text" id="loja-nome-input" required placeholder="Ex: Essências do Oriente">
                        </div>
                        <div class="form-group">
                            <label for="loja-capa-file">Banner / Foto de Capa:</label>
                            <input type="file" id="loja-capa-file" accept="image/*">
                        </div>

                        <div class="form-group">
                            <label for="loja-capa-fit">Ajuste da Capa:</label>
                            <select id="loja-capa-fit">
                                <option value="contain">Inteira (Sem cortes - Recomendado)</option>
                                <option value="cover">Preencher o espaço</option>
                            </select>

                            <div id="preview-capa-container" class="preview-container">
                                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">Pré-visualização:</p>
                                <div class="preview-box-capa">
                                    <img id="preview-capa-img" alt="Preview Capa">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="loja-desc-input">Biografia / Descrição:</label>
                            <textarea id="loja-desc-input" rows="2" placeholder="Ex: Os melhores perfumes importados e árabes."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="loja-grupo-input">Link do Grupo VIP (WhatsApp):</label>
                            <input type="url" id="loja-grupo-input" placeholder="Ex: https://chat.whatsapp.com/...">
                        </div>
                        <button type="submit" class="btn-submit">Salvar Alterações da Loja</button>
                    </form>
                </div>

                <!-- 2. Cadastrar ou Editar Produtos -->
                <div class="form-card">
                    <h2>📦 Gerenciamento de Produtos</h2>
                    <form id="form-produto">
                        <input type="hidden" id="produto-id">
                        <div class="form-group">
                            <label for="nome">Nome do Perfume / Produto:</label>
                            <input type="text" id="nome" required placeholder="Ex: R&E Parfum Árabe 100ml">
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="preco">Preço Normal (R$):</label>
                                <input type="text" id="preco" required placeholder="Ex: 160,00">
                            </div>
                            <div class="form-group">
                                <label for="tipo-desconto">Tipo de Desconto:</label>
                                <select id="tipo-desconto">
                                    <option value="porcentagem">Porcentagem (%)</option>
                                    <option value="dinheiro">Valor Fixo (R$)</option>
                                </select>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="valor-desconto">Valor do Desconto (Opcional):</label>
                            <input type="text" id="valor-desconto" placeholder="Ex: 15 (para 15% ou R$ 15 off)">
                        </div>

                        <div class="form-group">
                            <label for="produto-file">Foto do Produto:</label>
                            <input type="file" id="produto-file" accept="image/*">
                        </div>

                        <div class="form-group">
                            <label for="img-fit">Ajuste da Imagem do Produto:</label>
                            <select id="img-fit">
                                <option value="contain">Inteira (Sem cortes - Recomendado)</option>
                                <option value="cover">Preencher o espaço</option>
                            </select>
                            
                            <div id="preview-prod-container" class="preview-container">
                                <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">Pré-visualização:</p>
                                <div class="preview-box-img">
                                    <img id="preview-prod-img" alt="Preview Produto">
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="descricao">Descrição e Notas Olfativas:</label>
                            <textarea id="descricao" rows="3" required placeholder="Notas de topo, fixação, volumetria..."></textarea>
                        </div>
                        <div class="form-group">
                            <label for="whatsapp">WhatsApp para Vendas (com DDD):</label>
                            <input type="text" id="whatsapp" required placeholder="Ex: 5521999999999">
                        </div>
                        <button type="submit" id="btn-salvar-produto" class="btn-submit">Salvar Produto no Catálogo</button>
                    </form>
                </div>
                
                <div style="margin-top: 40px; max-width: 650px; margin-left: auto; margin-right: auto;">
                    <h3 style="color: var(--primary); font-size: 17px; margin-bottom: 15px; font-weight: 600;">Produtos Cadastrados</h3>
                    <div id="lista-gerenciador"></div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
